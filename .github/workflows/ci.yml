---
name: OpenWisp WiFi Login Pages CI BUILD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa-checks:
    name: QA-Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            node_modules/*
            !node_modules/.cache
            !node_modules/.cache/**
          key: >-
            ${{ format('{0}-{1}-{2}-yarn-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.node.outputs.node-version,
                hashFiles('yarn.lock', 'package.json', '.nvmrc', 'install-ci-deps.sh')) }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                hashFiles('requirements-test.txt', 'requirements.txt', 'requirements-qa.txt', 'setup.py',
                'install-ci-deps.sh', 'install-dev.sh')) }}

      - name: Installing dependencies
        id: deps
        env:
          CI_QA: "1"
        run: ./install-ci-deps.sh

      - name: QA checks
        run: ./run-qa-checks

  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_BROWSERS: firefox
      AI_REVIEW_SYSTEM_DEPS: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: geckodriver/firefox
        run: |
          echo "geckodriver/firefox"
          which geckodriver
          geckodriver --version
          which firefox
          firefox --version

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            node_modules/*
            !node_modules/.cache
            !node_modules/.cache/**
          key: >-
            ${{ format('{0}-{1}-{2}-yarn-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.node.outputs.node-version,
                hashFiles('yarn.lock', 'package.json', '.nvmrc', 'install-ci-deps.sh')) }}

      - name: Installing dependencies
        id: deps
        run: ./install-ci-deps.sh

      - name: CI entry point tests
        run: python -m unittest discover -s tests -p 'test_ci_*.py'

      - name: Tests
        run: |
          yarn build-dev
          ./runtests --coverage

      - name: ES5 Compliance Test
        run: ./runtests --es5

      # all the steps below are needed to run selenium browser tests

      - name: Get openwisp-radius
        run: |
          # TODO: switch back to master once the captive portal mock
          # redirect is merged in openwisp-radius
          git clone --depth=1 --branch captive-portal-mock-redirect https://github.com/openwisp/openwisp-radius/ openwisp-radius
          cd openwisp-radius
          echo "OpenWISP RADIUS commit: $(git rev-parse HEAD)"
          echo "OW_RADIUS_VERSION=$(git rev-parse HEAD)" >> $GITHUB_ENV
          python --version

      - name: Cache pip environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.OW_RADIUS_VERSION }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Start InfluxDB and Redis container
        run: |
          cd openwisp-radius
          docker compose up -d redis

      - name: Installing OpenWISP RADIUS
        run: |
          cd openwisp-radius
          pip install -U pip setuptools wheel
          pip install "Django~=5.2.0"
          # remove some test dependencies not used here
          sed -i '/openwisp-monitoring/d' requirements-test.txt
          sed -i '/mock-ssh-server/d' requirements-test.txt
          pip install -r requirements-test.txt
          pip install -e ".[saml]"
          ./tests/manage.py migrate

      - name: Creating configuration of organizations (mobile verification and sync auth)
        run: node browser-test/create-test-organizations.js

      - name: Run OpenWISP WiFi Login Pages dev server
        run: yarn start &

      - name: Run OpenWISP RADIUS dev server
        run: |
          cp browser-test/local_settings.py \
             openwisp-radius/tests/openwisp2/local_settings.py
          cd openwisp-radius
          ./tests/manage.py runserver &

      - name: Browser Tests
        env:
          SELENIUM_HEADLESS: "1"
        run: |
          export OPENWISP_RADIUS_PATH=$(pwd)/openwisp-radius
          ./browser-test/wait_for_url.sh http://0.0.0.0:8080
          ./runtests --browser

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
