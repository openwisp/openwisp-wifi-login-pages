---
name: OpenWisp WiFi Login Pages CI BUILD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa-checks:
    name: QA-Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Installing dependencies
        run: |
          yarn install
          python --version
          pip install -r requirements-qa.txt

      - name: QA checks
        run: ./run-qa-checks

  build:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"

      - name: geckodriver/firefox
        run: |
          echo "geckodriver/firefox"
          which geckodriver
          geckodriver --version
          which firefox
          firefox --version

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Installing dependencies
        run: |
          yarn install
          sudo apt update -qq
          sudo apt install -qq -y libssl-dev libffi-dev

      - name: Tests
        run: |
          yarn build-dev
          yarn coverage

      - name: ES5 Compliance Test
        run: yarn test-es5

      # all the steps below are needed to run selenium browser tests

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Get openwisp-radius
        run: |
          git clone --depth=1 https://github.com/openwisp/openwisp-radius/ openwisp-radius
          cd openwisp-radius
          echo "OpenWISP RADIUS commit: $(git rev-parse HEAD)"
          echo "OW_RADIUS_VERSION=$(git rev-parse HEAD)" >> $GITHUB_ENV
          python --version

      - name: Cache pip environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.OW_RADIUS_VERSION }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Start InfluxDB and Redis container
        run: |
          cd openwisp-radius
          docker compose up -d redis

      - name: Installing OpenWISP RADIUS
        run: |
          cd openwisp-radius
          pip install -U pip setuptools wheel
          pip install "Django~=5.2.0"
          # remove some test dependencies not used here
          sed -i '/openwisp-monitoring/d' requirements-test.txt
          sed -i '/mock-ssh-server/d' requirements-test.txt
          pip install -r requirements-test.txt
          pip install -e ".[saml]"
          ./tests/manage.py migrate

      - name: Creating configuration of organization (supports mobile verification)
        run: node browser-test/create-mobile-configuration.js

      - name: Run OpenWISP WiFi Login Pages dev server
        run: yarn start &

      - name: Run OpenWISP RADIUS dev server
        run: |
          cp browser-test/local_settings.py \
             openwisp-radius/tests/openwisp2/local_settings.py
          cd openwisp-radius
          ./tests/manage.py runserver &

      - name: Browser Tests
        env:
          SELENIUM_HEADLESS: "1"
        run: |
          export OPENWISP_RADIUS_PATH=$(pwd)/openwisp-radius
          ./browser-test/wait_for_url.sh http://0.0.0.0:8080
          yarn browser-test

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
